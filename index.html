<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSC सरकारी नौकरी | सिरोही जन सेवा केंद्र सैदपुर</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #0a3d62; --secondary: #eb2f06; --bg: #f0f4f7; --white: #ffffff; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        
        header { background: linear-gradient(rgba(10, 61, 98, 0.9), rgba(10, 61, 98, 0.9)), url('https://via.placeholder.com/1200x300') center/cover; color: white; padding: 35px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 2.2rem; }

        .contact-box { background: white; max-width: 950px; margin: -25px auto 20px; padding: 15px; border-radius: 12px; display: flex; justify-content: space-around; box-shadow: 0 10px 25px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px; position: relative; z-index: 10; }
        .contact-item { text-decoration: none; color: var(--primary); font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }

        .container { max-width: 1200px; margin: auto; padding: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .category-card { background: white; border-radius: 12px; padding: 18px; border-top: 5px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.3s; }
        .category-card:hover { transform: translateY(-5px); }
        
        .group-title { color: var(--secondary); font-size: 1.2rem; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        
        .btn-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .service-btn { text-decoration: none; background: #f8f9fa; color: var(--primary); padding: 10px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; border: 1px solid #dee2e6; transition: 0.3s; flex: 1 1 45%; text-align: center; }
        .service-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        
        /* विशेष सरकारी नौकरी बटन स्टाइल */
        .job-card { border-top-color: #eb2f06; }
        .job-btn { background: #fff5f5; border-color: #feb2b2; color: #eb2f06; }
        .job-btn:hover { background: #eb2f06; color: white; }

        .important-note { background: #fff5f5; border-left: 4px solid #e74c3c; padding: 10px; margin-top: 15px; font-size: 0.82rem; color: #c0392b; border-radius: 4px; font-weight: 600; }

        footer { background: #1e272e; color: white; padding: 25px; text-align: center; margin-top: 40px; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <h1>सिरोही जन सेवा केंद्र - Saidpur</h1>
    <p>CSC सरकारी नौकरी एवं डिजिटल सेवा पोर्टल</p>
</header>

<div class="contact-box">
    <a href="tel:7300789906" class="contact-item"><i class="fas fa-phone"></i> 7300789906</a>
    <a href="https://wa.me/917300789906" target="_blank" class="contact-item" style="color:#25D366;"><i class="fab fa-whatsapp"></i> व्हाट्सएप संपर्क</a>
    <a href="#" target="_blank" class="contact-item" style="color:#db4437;"><i class="fas fa-map-marker-alt"></i> शॉप लोकेशन</a>
</div>

<div class="container">
    <div class="grid" id="main-grid">
        </div>
</div>

<footer>
    <p>© 2026 सिरोही जन सेवा केंद्र | CSC सरकारी नौकरी Saidpur | All Rights Reserved</p>
</footer>

<script>
// 1. सामान्य सेवा लिंक
const serviceLinks = {
    "आय प्रमाण पत्र": "https://ascomputers078-glitch.github.io/E-DISTRICT/",
    "जाति प्रमाण पत्र": "https://ascomputers078-glitch.github.io/E-DISTRICT/",
    "निवास प्रमाण पत्र": "https://ascomputers078-glitch.github.io/E-DISTRICT/",
    "महिला जाति": "https://ascomputers078-glitch.github.io/E-DISTRICT/",
    "पैन कार्ड": "https://eportal.incometax.gov.in/",
    "आधार अपडेट": "https://myaadhaar.uidai.gov.in/",
    "वोटर आईडी": "https://voters.eci.gov.in/",
    "आयुष्मान कार्ड": "https://beneficiary.nha.gov.in/",
    "राशन कार्ड": "https://fcs.up.gov.in/",
    "खतौनी नकल": "https://upbhulekh.gov.in/",
    "बिजली बिल": "https://consumer.uppcl.org/",
    "ड्राइविंग लाइसेंस": "https://sarathi.parivahan.gov.in/"
};

// 2. सरकारी नौकरी लिंक (यहाँ अपनी नई वेबसाइट का लिंक डालें)
const jobLinks = {
    "लेटेस्ट नौकरी": "https://www.sarkariresult.com/", // अपनी वेबसाइट का लिंक यहाँ बदलें
    "एडमिट कार्ड": "https://www.sarkariresult.com/admitcard/", 
    "रिजल्ट": "https://www.sarkariresult.com/result/"
};

// 3. वेबसाइट स्ट्रक्चर (Sections)
const dashboardData = [
    { 
        title: "सरकारी भर्ती (Sarkari Job)", 
        icon: "fa-user-graduate", 
        isJob: true, 
        services: ["लेटेस्ट नौकरी", "एडमिट कार्ड", "रिजल्ट"] 
    },
    { 
        title: "प्रमाण पत्र सेवाएं", 
        icon: "fa-file-invoice", 
        note: "शादीशुदा महिला: मायका रिपोर्ट अनिवार्य है।", 
        services: ["आय प्रमाण पत्र", "जाति प्रमाण पत्र", "निवास प्रमाण पत्र", "महिला जाति"] 
    },
    { 
        title: "डिजिटल आईडी", 
        icon: "fa-id-card", 
        services: ["पैन कार्ड", "आधार अपडेट", "वोटर आईडी", "आयुष्मान कार्ड"] 
    },
    { 
        title: "ऑनलाइन फॉर्म / अन्य", 
        icon: "fa-laptop", 
        services: ["राशन कार्ड", "खतौनी नकल", "बिजली बिल", "ड्राइविंग लाइसेंस"] 
    }
];

// 4. ग्रिड रेंडरिंग इंजन
const mainGrid = document.getElementById('main-grid');

dashboardData.forEach(section => {
    const card = document.createElement('div');
    card.className = section.isJob ? 'category-card job-card' : 'category-card';
    
    let buttonsHTML = section.services.map(name => {
        // अगर सरकारी नौकरी सेक्शन है तो jobLinks से लिंक उठाएगा, वरना serviceLinks से
        const url = section.isJob ? jobLinks[name] : serviceLinks[name];
        const btnClass = section.isJob ? 'service-btn job-btn' : 'service-btn';
        
        return `<a href="${url || '#'}" target="_blank" class="${btnClass}">${name}</a>`;
    }).join('');

    card.innerHTML = `
        <div class="group-title"><i class="fas ${section.icon}"></i> ${section.title}</div>
        <div class="btn-container">${buttonsHTML}</div>
        ${section.note ? `<div class="important-note">⚠️ ${section.note}</div>` : ""}
    `;
    mainGrid.appendChild(card);
});
</script>

</body>
</html>
